<div class="flex flex-col justify-center w-full max-w-md mx-auto">

  <div class="w-full max-w-md mx-auto mb-5 sm:pt-10">
  <a routerLink="/"
    class="inline-flex items-center text-sm text-gray-500 transition-colors hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-300">
    <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 20 20" fill="none" class="size-5">
      <path d="M12.7083 5L7.5 10.2083L12.7083 15.4167" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
        stroke-linejoin="round"></path>
    </svg>
    Back to Login
  </a> 
</div>
  <h1 class="mb-4 text-xl font-semibold">Sign Up</h1>

  <form (ngSubmit)="onSubmit()" class="p-6 bg-white rounded shadow-md dark:bg-gray-900">
    <div class="space-y-4">

      <!-- First Name -->
      <div>
        
        <input [(ngModel)]="nom" name="fname" placeholder="First name" class="w-full p-2 mb-3 border rounded">
      </div>

      <!-- Last Name -->
      <div>
        
        <input [(ngModel)]="prenom" name="lname" placeholder="Last name" class="w-full p-2 mb-3 border rounded">
      </div>

      <!-- Email -->
      <div>
        
        <input [(ngModel)]="email" name="email" type="email" placeholder="Email" class="w-full p-2 mb-3 border rounded">
      </div>

      <!-- Password -->
      <div>
        
        <input type="password" [(ngModel)]="password" name="password" placeholder="Password" class="w-full p-2 mb-3 border rounded">
        

        <button type="button" (click)="togglePasswordVisibility()" class="text-sm text-blue-500">
          Show / Hide
        </button>
      </div>

      <!-- Checkbox -->
      <div class="flex items-center gap-2">
        <app-checkbox [(checked)]="isChecked"></app-checkbox>
        <span>Accept terms</span>
      </div>

      <!-- Button -->
      <button type="submit" class="w-full p-2 text-white bg-blue-500 rounded">
  Sign Up
</button>

    </div>
  </form>

</div>
