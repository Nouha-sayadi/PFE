<div class="ph-banner">
  <div class="ph-left">
    <div class="ph-icon">
      <ng-content select="[icon]"></ng-content>
    </div>
    <div class="ph-text">
      <h1 class="ph-title">{{ title }}</h1>
      <p class="ph-subtitle">{{ subtitle }}</p>
    </div>
  </div>
  <div class="ph-action">
    <ng-content select="[action]"></ng-content>
  </div>
</div>
