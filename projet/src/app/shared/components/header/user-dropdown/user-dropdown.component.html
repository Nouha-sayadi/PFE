<div class="relative">
  <button (click)="toggleDropdown()" class="flex items-center text-gray-700 dropdown-toggle dark:text-gray-400">
    <span class="mr-3 overflow-hidden rounded-full h-11 w-11 bg-blue-100 flex items-center justify-center font-semibold text-blue-700">
      <img *ngIf="user?.photoUrl && !photoError" [src]="photoUrl()" (error)="onPhotoError()"
           class="w-full h-full object-cover rounded-full" alt="Photo de profil" />
      <ng-container *ngIf="!user?.photoUrl || photoError">{{ user?.prenom }}{{ user?.nom }}</ng-container>
    </span>
    <span class="block mr-1 font-medium text-theme-sm">{{ user?.prenom }} {{ user?.nom }}</span>
    <svg
      [ngClass]="{
        'transition-transform duration-200': true,
        'rotate-180': isOpen
      }"
      width="18" height="20" viewBox="0 0 18 20" fill="none"
      xmlns="http://www.w3.org/2000/svg">
      <path d="M4.3125 8.65625L9 13.3437L13.6875 8.65625"
            stroke="currentColor" stroke-width="1.5"
            stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>

  <app-dropdown
    [isOpen]="isOpen"
    (close)="closeDropdown()"
    className="absolute right-0 mt-[17px] flex w-[260px] flex-col rounded-2xl border border-gray-200 bg-white p-3 shadow-theme-lg dark:border-gray-800 dark:bg-gray-dark">

    <!-- Info utilisateur -->
    <div *ngIf="user">
      <span class="block font-medium text-gray-700 text-theme-sm dark:text-gray-400">
        {{ user.prenom }} {{ user.nom }}
      </span>
      <span class="mt-0.5 block text-theme-xs text-gray-500 dark:text-gray-400">
        {{ user.email }}
      </span>
    </div>

    <ul class="flex flex-col gap-1 pt-4 pb-3 border-b border-gray-200 dark:border-gray-800">

      <!-- Mon Profil -->
      <li>
        <app-dropdown-item-two
          (itemClick)="closeDropdown()"
          tag="a"
          [to]="'/profileUser'"
          className="flex items-center gap-3 px-3 py-2 font-medium text-gray-700 rounded-lg group text-theme-sm hover:bg-gray-100 hover:text-gray-700 dark:text-gray-400 dark:hover:bg-white/5 dark:hover:text-gray-300">
          <svg class="fill-gray-500 group-hover:fill-gray-700 dark:fill-gray-400 dark:group-hover:fill-gray-300"
               width="24" height="24" viewBox="0 0 24 24" fill="none"
               xmlns="http://www.w3.org/2000/svg">
            <path fill-rule="evenodd" clip-rule="evenodd"
              d="M12 3.5C7.30558 3.5 3.5 7.30558 3.5 12C3.5 14.1526 4.3002 16.1184 5.61936
                 17.616C6.17279 15.3096 8.24852 13.5955 10.7246 13.5955H13.2746C15.7509 13.5955
                 17.8268 15.31 18.38 17.6167C19.6996 16.119 20.5 14.153 20.5 12C20.5 7.30558
                 16.6944 3.5 12 3.5ZM17.0246 18.8566V18.8455C17.0246 16.7744 15.3457 15.0955
                 13.2746 15.0955H10.7246C8.65354 15.0955 6.97461 16.7744 6.97461 18.8455V18.856
                 C8.38223 19.8895 10.1198 20.5 12 20.5C13.8798 20.5 15.6171 19.8898
                 17.0246 18.8566ZM2 12C2 6.47715 6.47715 2 12 2C17.5228 2 22 6.47715 22 12
                 C22 17.5228 17.5228 22 12 22C6.47715 22 2 17.5228 2 12ZM11.9991 7.25
                 C10.8847 7.25 9.98126 8.15342 9.98126 9.26784C9.98126 10.3823 10.8847
                 11.2857 11.9991 11.2857C13.1135 11.2857 14.0169 10.3823 14.0169 9.26784
                 C14.0169 8.15342 13.1135 7.25 11.9991 7.25ZM8.48126 9.26784C8.48126
                 7.32499 10.0563 5.75 11.9991 5.75C13.9419 5.75 15.5169 7.32499 15.5169
                 9.26784C15.5169 11.2107 13.9419 12.7857 11.9991 12.7857C10.0563 12.7857
                 8.48126 11.2107 8.48126 9.26784Z"
              fill=""/>
          </svg>
          Mon Profil
        </app-dropdown-item-two>
      </li>

    </ul>

    <!-- Logout -->
    <button
      (click)="logout()"
      class="flex items-center gap-3 px-3 py-2 mt-3 font-medium text-gray-700 rounded-lg group text-theme-sm hover:bg-gray-100 hover:text-gray-700 dark:text-gray-400 dark:hover:bg-white/5 dark:hover:text-gray-300">
      <!-- ✅ SVG logout propre — remplace le SVG corrompu -->
      <svg class="fill-gray-500 group-hover:fill-gray-700 dark:fill-gray-400 dark:group-hover:fill-gray-300"
           width="24" height="24" viewBox="0 0 24 24" fill="none"
           xmlns="http://www.w3.org/2000/svg">
        <path fill-rule="evenodd" clip-rule="evenodd"
          d="M15 3.5H9C7.067 3.5 5.5 5.067 5.5 7V17C5.5 18.933 7.067 20.5 9 20.5H15
             C16.933 20.5 18.5 18.933 18.5 17V15.75C18.5 15.3358 18.1642 15 17.75 15
             C17.3358 15 17 15.3358 17 15.75V17C17 18.1046 16.1046 19 15 19H9
             C7.89543 19 7 18.1046 7 17V7C7 5.89543 7.89543 5 9 5H15
             C16.1046 5 17 5.89543 17 7V8.25C17 8.66421 17.3358 9 17.75 9
             C18.1642 9 18.5 8.66421 18.5 8.25V7C18.5 5.067 16.933 3.5 15 3.5Z"
          fill=""/>
        <path fill-rule="evenodd" clip-rule="evenodd"
          d="M19.7803 12.5303C20.0732 12.2374 20.0732 11.7626 19.7803 11.4697L17.2803
             8.96967C16.9874 8.67678 16.5126 8.67678 16.2197 8.96967C15.9268 9.26256
             15.9268 9.73744 16.2197 10.0303L17.4393 11.25H10.75C10.3358 11.25 10 11.5858
             10 12C10 12.4142 10.3358 12.75 10.75 12.75H17.4393L16.2197 13.9697
             C15.9268 14.2626 15.9268 14.7374 16.2197 15.0303C16.5126 15.3232 16.9874
             15.3232 17.2803 15.0303L19.7803 12.5303Z"
          fill=""/>
      </svg>
      Déconnexion
    </button>

  </app-dropdown>
</div>
