<div class="relative">
  <button (click)="toggleDropdown()" class="flex items-center text-gray-700 dropdown-toggle dark:text-gray-400">
    <span class="mr-3 overflow-hidden rounded-full h-11 w-11 bg-blue-100 flex items-center justify-center font-semibold text-blue-700">
      {{ user.prenom }}{{ user.nom }}
    </span>
    <span class="block mr-1 font-medium text-theme-sm">{{ user?.prenom }} {{ user?.nom }}</span>
    <svg
      [ngClass]="{
        'transition-transform duration-200': true,
        'rotate-180': isOpen
      }"
      width="18" height="20" viewBox="0 0 18 20" fill="none"
      xmlns="http://www.w3.org/2000/svg">
      <path d="M4.3125 8.65625L9 13.3437L13.6875 8.65625"
            stroke="currentColor" stroke-width="1.5"
            stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>

  <app-dropdown
    [isOpen]="isOpen"
    (close)="closeDropdown()"
    className="absolute right-0 mt-[17px] flex w-[260px] flex-col rounded-2xl border border-gray-200 bg-white p-3 shadow-theme-lg dark:border-gray-800 dark:bg-gray-dark">

    <!-- Info utilisateur -->
    <div *ngIf="user">
      <span class="block font-medium text-gray-700 text-theme-sm dark:text-gray-400">
        {{ user.prenom }} {{ user.nom }}
      </span>
      <span class="mt-0.5 block text-theme-xs text-gray-500 dark:text-gray-400">
        {{ user.email }}
      </span>
    </div>

    <ul class="flex flex-col gap-1 pt-4 pb-3 border-b border-gray-200 dark:border-gray-800">
