<div class="relative">

  <!-- Bouton cloche -->
  <button
    class="relative flex items-center justify-center text-gray-500 transition-colors bg-white border border-gray-200 rounded-full dropdown-toggle hover:text-gray-700 h-11 w-11 hover:bg-gray-100 dark:border-gray-800 dark:bg-gray-900 dark:text-gray-400 dark:hover:bg-gray-800 dark:hover:text-white"
    (click)="toggleDropdown()"
  >
    <!-- Badge compteur -->
    <span
      *ngIf="unreadCount > 0"
      class="absolute -top-1 -right-1 z-10 flex items-center justify-center h-5 w-5 rounded-full bg-orange-500 text-white text-xs font-bold"
    >{{ unreadCount > 9 ? '9+' : unreadCount }}</span>

    <!-- Ping dot si aucun badge mais notifs -->
    <span
      *ngIf="unreadCount === 0 && notifications.length > 0"
      class="absolute right-0 top-0.5 z-10 h-2 w-2 rounded-full bg-gray-300"
    ></span>

    <svg class="fill-current" width="20" height="20" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
      <path fill-rule="evenodd" clip-rule="evenodd"
        d="M10.75 2.29248C10.75 1.87827 10.4143 1.54248 10 1.54248C9.58583 1.54248 9.25004 1.87827 9.25004 2.29248V2.83613C6.08266 3.20733 3.62504 5.9004 3.62504 9.16748V14.4591H3.33337C2.91916 14.4591 2.58337 14.7949 2.58337 15.2091C2.58337 15.6234 2.91916 15.9591 3.33337 15.9591H4.37504H15.625H16.6667C17.0809 15.9591 17.4167 15.6234 17.4167 15.2091C17.4167 14.7949 17.0809 14.4591 16.6667 14.4591H16.375V9.16748C16.375 5.9004 13.9174 3.20733 10.75 2.83613V2.29248ZM14.875 14.4591V9.16748C14.875 6.47509 12.6924 4.29248 10 4.29248C7.30765 4.29248 5.12504 6.47509 5.12504 9.16748V14.4591H14.875ZM8.00004 17.7085C8.00004 18.1228 8.33583 18.4585 8.75004 18.4585H11.25C11.6643 18.4585 12 18.1228 12 17.7085C12 17.2943 11.6643 16.9585 11.25 16.9585H8.75004C8.33583 16.9585 8.00004 17.2943 8.00004 17.7085Z"
        fill="currentColor"/>
    </svg>
  </button>

  <!-- Panneau dropdown -->
  <app-dropdown
    [isOpen]="isOpen"
    (close)="closeDropdown()"
    className="absolute -right-[240px] mt-[17px] flex h-[480px] w-[360px] flex-col rounded-2xl border border-gray-200 bg-white shadow-theme-lg dark:border-gray-800 dark:bg-gray-dark sm:w-[361px] lg:right-0"
  >
    <!-- Header -->
    <div class="flex items-center justify-between px-4 py-3 border-b border-gray-100 dark:border-gray-700">
      <h5 class="text-base font-semibold text-gray-800 dark:text-gray-200">
        Notifications
        <span *ngIf="unreadCount > 0" class="ml-2 text-xs font-bold text-orange-500">({{ unreadCount }} non lues)</span>
      </h5>
      <div class="flex items-center gap-2">
        <button
          *ngIf="unreadCount > 0"
          (click)="markAllAsRead()"
          class="text-xs text-blue-600 hover:underline dark:text-blue-400"
        >Tout marquer lu</button>
        <button (click)="closeDropdown()" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200">
          <svg class="fill-current" width="18" height="18" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path fill-rule="evenodd" clip-rule="evenodd"
              d="M6.21967 7.28131C5.92678 6.98841 5.92678 6.51354 6.21967 6.22065C6.51256 5.92775 6.98744 5.92775 7.28033 6.22065L11.999 10.9393L16.7176 6.22078C17.0105 5.92789 17.4854 5.92788 17.7782 6.22078C18.0711 6.51367 18.0711 6.98855 17.7782 7.28144L13.0597 12L17.7782 16.7186C18.0711 17.0115 18.0711 17.4863 17.7782 17.7792C17.4854 18.0721 17.0105 18.0721 16.7176 17.7792L11.999 13.0607L7.28033 17.7794C6.98744 18.0722 6.51256 18.0722 6.21967 17.7794C5.92678 17.4865 5.92678 17.0116 6.21967 16.7187L10.9384 12L6.21967 7.28131Z"
              fill="currentColor"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Liste -->
    <ul class="flex flex-col overflow-y-auto flex-1 custom-scrollbar">

      <!-- Vide -->
      <li *ngIf="notifications.length === 0" class="flex flex-col items-center justify-center h-full text-gray-400 dark:text-gray-600 gap-2 py-10">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 22C13.1 22 14 21.1 14 20H10C10 21.1 10.9 22 12 22ZM18 16V11C18 7.93 16.36 5.36 13.5 4.68V4C13.5 3.17 12.83 2.5 12 2.5C11.17 2.5 10.5 3.17 10.5 4V4.68C7.63 5.36 6 7.92 6 11V16L4 18V19H20V18L18 16Z" fill="currentColor"/>
        </svg>
        <span class="text-sm">Aucune notification</span>
      </li>

      <!-- Items -->
      <li
        *ngFor="let n of notifications"
        (click)="clickNotif(n)"
        class="flex gap-3 px-4 py-3 border-b border-gray-100 dark:border-gray-800 cursor-pointer hover:bg-gray-50 dark:hover:bg-white/5 transition-colors"
        [class.bg-blue-50]="!n.read"
        [class.dark:bg-blue-900\/10]="!n.read"
      >
        <!-- Icône type -->
        <span
          class="flex-shrink-0 flex items-center justify-center w-9 h-9 rounded-full text-sm font-bold text-white"
          [ngClass]="{
            'bg-blue-500':   n.type === 'PROJECT_ASSIGNMENT',
            'bg-orange-500': n.type === 'POINTAGE_REMINDER',
            'bg-red-500':    n.type === 'DEADLINE_EXCEEDED'
          }"
        >{{ iconLabel(n.type) }}</span>

        <!-- Contenu -->
        <span class="flex-1 min-w-0">
          <span class="block text-sm font-medium text-gray-800 dark:text-gray-100 truncate">{{ n.title }}</span>
          <span class="block text-xs text-gray-500 dark:text-gray-400 mt-0.5 leading-snug">{{ n.message }}</span>
          <span class="block text-xs text-gray-400 dark:text-gray-600 mt-1">{{ timeAgo(n.createdAt) }}</span>
        </span>

        <!-- Point non lu -->
        <span *ngIf="!n.read" class="flex-shrink-0 mt-1 w-2 h-2 rounded-full bg-orange-400"></span>
      </li>
    </ul>
  </app-dropdown>
</div>

<!-- Toast temps réel -->
<div
  *ngIf="toast"
  class="fixed top-5 right-5 z-[9999] flex items-start gap-3 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl shadow-lg px-4 py-3 w-80 animate-slide-in"
  (click)="dismissToast()"
>
  <span
    class="flex-shrink-0 flex items-center justify-center w-8 h-8 rounded-full text-sm font-bold text-white"
    [ngClass]="{
      'bg-blue-500':   toast.type === 'PROJECT_ASSIGNMENT',
      'bg-orange-500': toast.type === 'POINTAGE_REMINDER',
      'bg-red-500':    toast.type === 'DEADLINE_EXCEEDED'
    }"
  >{{ iconLabel(toast.type) }}</span>
  <div class="flex-1 min-w-0">
    <p class="text-sm font-semibold text-gray-800 dark:text-gray-100">{{ toast.title }}</p>
    <p class="text-xs text-gray-500 dark:text-gray-400 mt-0.5 leading-snug">{{ toast.message }}</p>
  </div>
  <button class="text-gray-400 hover:text-gray-600 text-xs mt-0.5">✕</button>
</div>
