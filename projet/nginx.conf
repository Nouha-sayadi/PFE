# ╔════════════════════════════════════════════════════════════════╗
# ║                    CONFIGURATION NGINX                         ║
# ║  Serve Frontend + Proxy vers Backend + SPA Routing             ║
# ╚════════════════════════════════════════════════════════════════╝

# Nombre de worker processes (1 = par défaut, auto = auto-detect)
worker_processes auto;

# Events configuration
events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

# Configuration HTTP
http {
    # Types MIME
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logs
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    # ═════════════════════════════════════════════════════════════════
    # 🌍 UPSTREAM : Backend Spring Boot
    # ═════════════════════════════════════════════════════════════════
    upstream backend {
        # Utilise le DNS Docker Compose (backend = hostname du service)
        server backend:8080 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # ═════════════════════════════════════════════════════════════════
    # 🖥️ SERVER BLOCK : Frontend + Proxy
    # ═════════════════════════════════════════════════════════════════
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # Répertoire racine (dist/ d'Angular)
        root /usr/share/nginx/html;
        index index.html index.htm;

        # ─────────────────────────────────────────────────────────────
        # 📌 FRONT-END : Serve les fichiers statiques
        # ─────────────────────────────────────────────────────────────
        
        # Assets (images, JS, CSS) - cache long
        location ~* ^/(assets|dist)/(.+\.(js|css|png|jpg|jpeg|gif|svg|woff|woff2|ttf|eot))$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # Index.html - pas de cache (toujours vérifier)
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # ─────────────────────────────────────────────────────────────
        # 🔗 PROXY : Requêtes API vers le Backend
        # ─────────────────────────────────────────────────────────────
        
        # Toutes les requêtes /api/* vont vers le backend
        location /api/ {
            proxy_pass http://backend;
            
            # Headers HTTP
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            
            # Buffering
            proxy_buffering off;
        }

        # Keycloak proxy (OAuth2)
        location /auth/ {
            proxy_pass http://keycloak:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ─────────────────────────────────────────────────────────────
        # 🎯 SPA ROUTING : Fallback à index.html
        # ─────────────────────────────────────────────────────────────
        
        # Si le fichier n'existe pas, redirige vers index.html
        # (Angular Router gère l'URL en frontend)
        location / {
            try_files $uri $uri/ /index.html;
        }

        # ─────────────────────────────────────────────────────────────
        # 🚫 Bloque les accès non autorisés
        # ─────────────────────────────────────────────────────────────
        
        # Pas d'accès à .git, node_modules, etc.
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        # ─────────────────────────────────────────────────────────────
        # 💚 Health Check Kubernetes / Docker
        # ─────────────────────────────────────────────────────────────
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # ─────────────────────────────────────────────────────────────
        # 📊 Logs
        # ─────────────────────────────────────────────────────────────
        access_log /var/log/nginx/frontend_access.log;
        error_log /var/log/nginx/frontend_error.log warn;
    }
}