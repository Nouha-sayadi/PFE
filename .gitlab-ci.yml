

image: docker:24.0.0

services:
  - docker:24.0.0-dind


stages:
  - build      
  - test        
  - docker      
  - deploy      


variables:
  DOCKER_REGISTRY: "gitlab.hacloud.fr"
  DOCKER_NAMESPACE: "snouha"
  DOCKER_PROJECT: "pfe"
  DOCKER_IMAGE_BACKEND: "${DOCKER_REGISTRY}/${DOCKER_NAMESPACE}/${DOCKER_PROJECT}/backend"
  DOCKER_IMAGE_FRONTEND: "${DOCKER_REGISTRY}/${DOCKER_NAMESPACE}/${DOCKER_PROJECT}/frontend"
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"



# 📌 Job 1.1 : Build Backend (Maven)
build:backend:
  stage: build
  image: maven:3.9-eclipse-temurin-17
  script:
    - echo "🔨 Compilation Backend avec Maven..."
    - java -version
    - mvn -version
    - cd st2i
    - mvn clean package -DskipTests -X
    - echo "✅ Backend compilé avec succès"
    - ls -la target/*.jar
  
  cache:
    paths:
      - .m2/repository
      - st2i/target
  
  artifacts:
    paths:
      - st2i/target/*.jar
    expire_in: 1 hour
  
  retry:
    max: 2
    when:
      - runner_system_failure
  
  tags:
    - docker

# 📌 Job 1.2 : Build Frontend (npm/Angular)
build:frontend:
  stage: build
  image: node:20-alpine
  script:
    - echo "🔨 Compilation Frontend avec Angular..."
    - node --version
    - npm --version
    - cd projet
    - echo "📥 Installation des dépendances..."
    - npm ci --prefer-offline --no-audit
    - echo "🔨 Build de production..."
    - npm run build -- --configuration production
    - echo "✅ Frontend compilé avec succès"
    - ls -la dist/
  
  cache:
    paths:
      - projet/node_modules
      - projet/.angular
  
  artifacts:
    paths:
      - projet/dist
    expire_in: 1 hour
  
  tags:
    - docker



# 📌 Job 2.1 : Tests Backend (JUnit)
test:backend:
  stage: test
  image: maven:3.9-eclipse-temurin-17
  dependencies:
    - build:backend
  script:
    - echo " Tests Backend..."
    - cd st2i
    - mvn test
    - mvn jacoco:report
    - echo " Tests Backend terminés"
  
  cache:
    paths:
      - .m2/repository
  
  artifacts:
    when: always
    reports:
      junit: st2i/target/surefire-reports/TEST-*.xml
    paths:
      - st2i/target/site/jacoco/index.html
    expire_in: 30 days
  
  allow_failure: false
  
  tags:
    - docker

# 📌 Job 2.2 : Tests Frontend (Karma/Jasmine)
test:frontend:
  stage: test
  image: node:20-alpine
  dependencies:
    - build:frontend
  script:
    - echo " Tests Frontend..."
    - cd projet
    - npm run test -- --watch=false --browsers=ChromeHeadless --code-coverage
    - echo " Tests Frontend terminés"
  
  cache:
    paths:
      - projet/node_modules
  
  artifacts:
    when: always
    reports:
      junit: projet/dist/coverage/junit.xml
    paths:
      - projet/dist/coverage
    expire_in: 30 days
  
  allow_failure: true
  tags:
    - docker



# 📌 Job 3.1 : Build Image Docker Backend
docker:build:backend:
  stage: docker
  image: docker:24.0.0
  services:
    - docker:24.0.0-dind
  dependencies:
    - build:backend
    - test:backend
  before_script:
    # Login au registry GitLab privé
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $DOCKER_REGISTRY
  script:
    - echo " Construction image Docker Backend..."
    - docker build -t ${DOCKER_IMAGE_BACKEND}:${CI_COMMIT_SHA} st2i/
    - docker build -t ${DOCKER_IMAGE_BACKEND}:latest st2i/
    - echo " Push vers registry GitLab..."
    - docker push ${DOCKER_IMAGE_BACKEND}:${CI_COMMIT_SHA}
    - docker push ${DOCKER_IMAGE_BACKEND}:latest
    - echo " Image Backend pushée"
  
  after_script:
    - docker logout $DOCKER_REGISTRY
  
  only:
    - main
    - develop
  tags:
    - docker

# 📌 Job 3.2 : Build Image Docker Frontend
docker:build:frontend:
  stage: docker
  image: docker:24.0.0
  services:
    - docker:24.0.0-dind
  dependencies:
    - build:frontend
    - test:frontend
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $DOCKER_REGISTRY
  script:
    - echo " Construction image Docker Frontend..."
    - docker build -t ${DOCKER_IMAGE_FRONTEND}:${CI_COMMIT_SHA} projet/
    - docker build -t ${DOCKER_IMAGE_FRONTEND}:latest projet/
    - echo "Push vers registry GitLab..."
    - docker push ${DOCKER_IMAGE_FRONTEND}:${CI_COMMIT_SHA}
    - docker push ${DOCKER_IMAGE_FRONTEND}:latest
    - echo " Image Frontend pushée"
  after_script:
    - docker logout $DOCKER_REGISTRY
  
  only:
    - main
    - develop
  tags:
    - docker



# 📌 Job 4.1 : Déploiement Local avec Docker Compose
deploy:local:
  stage: deploy
  image: docker:24.0.0
  services:
    - docker:24.0.0-dind
  script:
    - echo "Déploiement Local avec docker-compose..."
    - apk add docker-compose python3
    - docker-compose up -d
    - docker-compose ps
    - echo "Application déployée"
    - echo "Backend : http://localhost:8080"
    - echo "Frontend : http://localhost:80"
    - echo "Keycloak : http://localhost:8080/auth"
  
  only:
    - main
  environment:
    name: production
    url: http://localhost
  tags:
    - docker

